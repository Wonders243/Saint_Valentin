<!-- player.html - Lecteur musique caché -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background: transparent; }
    audio { width: 1px; height: 1px; position: absolute; opacity: 0; }
  </style>
</head>
<body>
  <audio id="globalMusic" loop autoplay preload="auto" controls style="display: none;">
    <source src="audio/spy.mp3" type="audio/mp3">
  </audio>
  
  <script>
    // Sauvegarder l'état
    const audio = document.getElementById('globalMusic');
    
    window.addEventListener('beforeunload', function() {
      localStorage.setItem('musicTime', audio.currentTime);
      localStorage.setItem('musicPlaying', !audio.paused);
    });
    
    window.addEventListener('load', function() {
      const savedTime = localStorage.getItem('musicTime');
      const shouldPlay = localStorage.getItem('musicPlaying') === 'true';
      
      if (savedTime) audio.currentTime = parseFloat(savedTime);
      if (shouldPlay) audio.play();
    });
  </script>
</body>
</html>
